<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08111f" />
  <meta name="application-version" content="" />
  <title>移动端扫码 - singledeviceDFTFA</title>
  <link rel="stylesheet" href="./assets/styles.css?v=1.5.0" />
  <link rel="stylesheet" href="./assets/result-state.v1.3.0.css" />
  <script src="./assets/app-version.js?v=1.5.0" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
  <script src="./assets/qr-scanner.v1.3.0.js" defer></script>
</head>
<body data-mode="camera">
  <main class="page-shell mobile-page">
    <section class="tool-card mobile-tool-card">
      <header class="tool-header">
        <nav class="top-nav">
          <div class="top-nav-links">
            <a class="portal-link" href="https://easonxavier.github.io/" aria-label="返回 Eason's Tools 门户">
              <span class="portal-mark" aria-hidden="true"><span></span><span></span><span></span></span>
              <span>Eason's Tools</span>
            </a>
            <a class="tool-home-link" href="./index.html" aria-label="返回工具首页">← 返回工具首页</a>
          </div>
          <span class="version-badge"><span data-app-version></span> · <time data-app-release-date></time></span>
        </nav>
        <div>
          <p class="eyebrow">手机扫码模式</p>
          <h1>扫描动态二维码</h1>
          <p class="lead">二维码内容变化后会生成新的 Index。请以取景框、结果区和复制按钮状态判断最新链接是否已复制及是否仍然有效。</p>
        </div>
      </header>

      <div class="scanner-workspace">
        <section class="scanner-column" aria-label="摄像头扫码区">
          <div class="scanner-frame camera-frame" id="scannerFrame">
            <video id="preview" playsinline muted></video>
            <div class="scan-mask" aria-hidden="true"></div>
            <div class="scanner-hud" aria-hidden="true">
              <span id="cameraState" class="camera-state">摄像头未启动</span>
              <span id="previewIndex" class="preview-index">Index --</span>
            </div>
            <div id="scanUpdateFlash" class="scan-update-flash" aria-hidden="true"></div>
          </div>

          <div class="controls compact-controls">
            <button id="startBtn" type="button">开始扫码</button>
            <button id="stopBtn" type="button" class="secondary" disabled>结束扫码</button>
          </div>
        </section>

        <section class="result-panel result-column" aria-live="polite" aria-atomic="true">
          <div class="result-heading">
            <div>
              <p class="result-kicker">最新识别结果</p>
              <h2 id="resultIndex">Index --</h2>
            </div>
            <time id="resultTime" class="result-time" datetime="">尚未更新</time>
          </div>

          <div id="updateNotice" class="update-notice" role="status" data-state="waiting">
            等待二维码更新
          </div>

          <div class="result-preview">
            <button id="previewToggleBtn" class="preview-toggle" type="button" aria-expanded="false" aria-controls="resultPreviewBody" data-expanded="false" disabled>展开链接内容</button>
            <div id="resultPreviewBody" class="result-preview-body" hidden>
              <label for="resultText">带 Index 的链接</label>
              <textarea id="resultText" readonly placeholder="识别成功后，将显示“Index 001｜链接”。"></textarea>
            </div>
          </div>

          <p id="statusText" class="status">准备就绪，点击“开始扫码”。</p>
          <button id="copyBtn" type="button" class="copy-state-empty" data-copy-state="empty" disabled>等待识别结果</button>
        </section>
      </div>

      <canvas id="scanCanvas" hidden></canvas>
    </section>
  </main>
</body>
</html>
