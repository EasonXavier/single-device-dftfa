<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>移动端扫码 - singledeviceDFTFA</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
  <script src="./assets/qr-scanner.js" defer></script>
</head>
<body data-mode="camera">
  <main class="page-shell">
    <section class="tool-card">
      <nav class="top-nav"><a href="./index.html">返回首页</a></nav>
      <p class="eyebrow">手机扫码模式</p>
      <h1>打开摄像头扫一扫</h1>
      <p class="lead">点击“开始扫码”后按提示授权即可。将二维码放在取景框中央，识别会更快更稳。</p>

      <div class="scanner-frame">
        <video id="preview" playsinline muted></video>
        <div class="scan-mask" aria-hidden="true"></div>
      </div>

      <div class="controls">
        <button id="startBtn" type="button">开始扫码</button>
        <button id="stopBtn" type="button" class="secondary" disabled>结束扫码</button>
      </div>

      <section class="result-panel" aria-live="polite">
        <label for="resultText">扫码结果</label>
        <textarea id="resultText" readonly placeholder="识别成功后，内容会显示在这里。"></textarea>
        <p id="statusText" class="status">准备就绪，点击“开始扫码”。</p>
        <button id="copyBtn" type="button" disabled>复制结果</button>
      </section>

      <canvas id="scanCanvas" hidden></canvas>
    </section>
  </main>
</body>
</html>
