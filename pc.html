<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PC端扫码 - singledeviceDFTFA</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
  <script src="./assets/qr-scanner.js" defer></script>
</head>
<body data-mode="screen">
  <main class="page-shell">
    <section class="tool-card">
      <nav class="top-nav"><a href="./index.html">返回选择页</a></nav>
      <p class="eyebrow">PC端模式</p>
      <h1>屏幕共享识别二维码</h1>
      <p class="lead">点击“开始屏幕共享”后，选择包含二维码的窗口、标签页或整个屏幕。系统会在本地画面帧中搜索二维码。</p>

      <div class="scanner-frame wide">
        <video id="preview" playsinline muted></video>
        <div class="scan-mask" aria-hidden="true"></div>
      </div>

      <div class="controls">
        <button id="startBtn" type="button">开始屏幕共享</button>
        <button id="stopBtn" type="button" class="secondary" disabled>停止扫描</button>
      </div>

      <section class="result-panel" aria-live="polite">
        <label for="resultText">识别结果</label>
        <textarea id="resultText" readonly placeholder="识别到屏幕中的二维码后，链接会显示在这里。"></textarea>
        <p id="statusText" class="status">尚未开始扫描。</p>
        <button id="copyBtn" type="button" disabled>复制二维码链接</button>
      </section>

      <canvas id="scanCanvas" hidden></canvas>
    </section>
  </main>
</body>
</html>
